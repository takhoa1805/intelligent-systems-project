services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: olist_migration_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: olist_test
    # Separate project, no host ports, no persistent development database volume.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../../dataset:/olist-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olist_migration_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    image: flyway/flyway:10-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/olist_migration_test
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: olist_test
      FLYWAY_CONNECT_RETRIES: 10
    command: migrate

  assertions:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: olist_test
    volumes:
      - ./olist_import_assertions.sql:/assertions.sql:ro
    command: ["psql", "-h", "db", "-U", "postgres", "-d", "olist_migration_test", "-v", "ON_ERROR_STOP=1", "-f", "/assertions.sql"]
